<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animadito · Crea tu video animado</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Fredoka','system-ui','sans-serif']},colors:{ink:'#1B1F3B',sun:'#FFB703',mist:'#EAF0FB'}}}}</script>
<style>
.film{background:#1B1F3B;padding:14px 0;border-radius:18px;position:relative}
.film::before,.film::after{content:"";position:absolute;left:10px;right:10px;height:6px;background:repeating-linear-gradient(90deg,#EAF0FB 0 10px,transparent 10px 22px);border-radius:3px}
.film::before{top:4px}.film::after{bottom:4px}
.film>div{margin:0 14px;border-radius:6px;overflow:hidden;background:#0d1024}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #FFB703;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="bg-mist text-ink min-h-screen font-sans">
<main class="max-w-6xl mx-auto p-5 md:p-8">
  <h1 class="text-3xl md:text-4xl font-semibold">Animadito</h1>
  <p class="mt-1 text-ink/70">Escribe una conversación y la convertimos en un video animado con voz y música.</p>

  <div class="mt-6 grid md:grid-cols-2 gap-6">
    <section class="bg-white rounded-3xl p-5 md:p-6 shadow-sm">
      <label for="guion" class="font-medium">¿Qué dicen tus personajes?</label>
      <textarea id="guion" rows="8" class="mt-2 w-full rounded-2xl border-2 border-ink/15 p-3 text-lg leading-snug focus:border-ink resize-y" placeholder="Pedro: Hola&#10;María: Adiós">Pedro: ¡Hola María! ¿Cómo estás?
María: ¡Muy bien, gracias! Hoy es un día genial.
Pedro: ¡Qué bueno! Vamos a celebrar.</textarea>
      <p class="text-sm text-ink/60 mt-1">Una línea por persona: «Nombre: lo que dice».</p>

      <div id="quienes" class="mt-4 grid gap-2"></div>

      <label class="block mt-4">
        <span class="font-medium">Música de fondo</span>
        <select id="musica" class="mt-1 w-full rounded-xl border-2 border-ink/15 p-2.5 bg-white">
          <option>Sin música</option><option>Alegre</option><option>Calmada</option><option>Épica</option><option>Misteriosa</option>
        </select>
      </label>

      <button id="go" class="mt-6 w-full rounded-2xl bg-sun text-ink text-xl font-semibold py-4 shadow-[0_5px_0_#B07C00] active:translate-y-1 active:shadow-[0_1px_0_#B07C00] disabled:opacity-60 transition">Generar Video Animado</button>
    </section>

    <section>
      <div class="film"><div>
        <div id="vacio" class="aspect-video grid place-items-center text-mist/80 text-center p-6">Tu video aparecerá aquí</div>
        <video id="video" class="w-full aspect-video hidden" controls playsinline></video>
      </div></div>
      <div class="mt-4" aria-live="polite">
        <div class="h-3 rounded-full bg-white overflow-hidden"><div id="barra" class="h-full bg-ink rounded-full transition-all duration-500" style="width:0%"></div></div>
        <p id="msg" class="mt-2 font-medium min-h-[1.5rem]"></p>
        <button id="bajar" disabled class="mt-3 w-full md:w-auto rounded-xl bg-ink text-white px-5 py-3 font-medium flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-ink/90 transition">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>
          <span id="bajarTxt">Descargar video</span>
        </button>
      </div>
    </section>
  </div>
</main>

<script>
const API = location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8000';
const AV = ['Hombre joven','Mujer ejecutiva','Abuelo simpático','Niña','Robot'];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

function personajes(){
  const r=[];
  for(const l of $('guion').value.split('\n')){
    const m=l.match(/^\s*([^:：]{1,30})[:：]/);
    if(m && !r.includes(m[1].trim())) r.push(m[1].trim());
  }
  return r;
}
function elegidos(){
  const o={};
  document.querySelectorAll('select[data-p]').forEach(s=>o[s.dataset.p]=s.value);
  return o;
}
function pintar(){
  const prev=elegidos();
  $('quienes').innerHTML = personajes().map((p,i)=>`
    <label class="flex items-center gap-3">
      <span class="w-28 truncate font-medium">${esc(p)}</span>
      <select data-p="${esc(p)}" class="flex-1 rounded-xl border-2 border-ink/15 p-2 bg-white">
        ${AV.map(a=>`<option ${(prev[p]||AV[i%AV.length])===a?'selected':''}>${a}</option>`).join('')}
      </select>
    </label>`).join('');
}
function estado(pct,texto){
  if(pct!==null) $('barra').style.width=pct+'%';
  $('msg').textContent=texto;
}
function ocupado(b){ $('go').disabled=b; $('go').textContent=b?'Creando tu video…':'Generar Video Animado'; }

async function generar(){
  if(!$('guion').value.trim()) return estado(0,'Escribe una conversación, por ejemplo «Pedro: Hola».');
  ocupado(true); $('bajar').disabled=true; urlVideo=null; estado(2,'Preparando tu video…');
  try{
    const r=await fetch(API+'/generar',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({guion:$('guion').value,avatares:elegidos(),musica:$('musica').value})});
    sondear((await r.json()).id);
  }catch{
    estado(0,'El programa está apagado. Ábrelo con el archivo «Iniciar» y vuelve a intentar.'); ocupado(false);
  }
}
async function sondear(id){
  try{
    const e=await (await fetch(API+'/estado/'+id)).json();
    estado(e.progreso,e.mensaje);
    if(e.estado==='listo'){
      const u=API+e.video;
      $('vacio').classList.add('hidden'); $('video').classList.remove('hidden');
      $('video').src=u; $('video').play().catch(()=>{});
      urlVideo=u; $('bajar').disabled=false; ocupado(false); return;
    }
    if(e.estado==='error'){ ocupado(false); return; }
  }catch{ estado(null,'Reconectando…'); }
  setTimeout(()=>sondear(id),700);
}
let urlVideo=null;
async function descargar(){
  if(!urlVideo) return;
  $('bajarTxt').textContent='Descargando…';
  try{
    const b=await (await fetch(urlVideo)).blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='mi-video-animado.mp4';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    estado(null,'¡Listo! Tu video se guardó en Descargas.');
  }catch{ estado(null,'No pudimos descargarlo. Inténtalo otra vez.'); }
  $('bajarTxt').textContent='Descargar video';
}
$('bajar').onclick=descargar;
$('go').onclick=generar;
$('guion').addEventListener('input',pintar);
pintar();
</script>
</body>
</html>
